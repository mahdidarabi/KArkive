# Deploy the landing at docs/ to GitHub Pages.
#
# Repo setting (once): Settings → Pages → Source = GitHub Actions
# Custom domain: karkive.ir
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
