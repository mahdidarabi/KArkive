# Generic MariaDB restore sample. Apply after a Backup has written dumps to S3
# and a target MariaDB is reachable from this namespace.
apiVersion: karkive.io/v1alpha1
kind: Restore
metadata:
  name: app-mariadb
  namespace: backup
spec:
  engine: mariadb
  schedule: "30 2 * * *"
  suspend: true
  database:
    host: mariadb.example.svc.cluster.local
    port: 3306
    name: app
  s3:
    endpoint: https://s3.example.com
    bucket: backups
    path: app/mysqldump
  secretRef:
    name: restore-app-mariadb
  mariadbSecret:
    name: mariadb
    usernameKey: username
    passwordKey: password
  persistence:
    enabled: false
    size: 2Gi
  job:
    backoffLimit: 1
    restartPolicy: Never
