apiVersion: karkive.io/v1alpha1
kind: Backup
metadata:
  name: app-mariadb
  namespace: backup
spec:
  engine: mariadb
  schedule: "0 2 * * *"
  database:
    host: mariadb.example.svc.cluster.local
    port: 3306
    name: app
  s3:
    endpoint: https://s3.example.com
    bucket: backups
    path: app/mysqldump
    retentionDays: 14
  secretRef:
    name: backup-app-mariadb
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard
  localRetentionDays: 7
