---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-karkive-io-v1alpha1-backup
  failurePolicy: Fail
  name: vbackup.karkive.io
  rules:
  - apiGroups:
    - karkive.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-karkive-io-v1alpha1-restore
  failurePolicy: Fail
  name: vrestore.karkive.io
  rules:
  - apiGroups:
    - karkive.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - restores
  sideEffects: None
