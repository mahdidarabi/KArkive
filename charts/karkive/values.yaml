image:
  repository: ghcr.io/mahdidarabi/karkive
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

leaderElection: true

# Empty = watch all namespaces.
watchNamespace: ""

defaults:
  # cleanup + compress (find, gzip)
  busyboxImage: docker.io/library/busybox:1.37
  # encrypt (gpg)
  gnupgImage: docker.io/instrumentisto/gnupg:2.4
  # pgdump only
  postgresImage: docker.io/cloudnative-pg/postgresql:18.4
  mcImage: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
  mariadbImage: docker.io/library/mariadb:10.6
  redisImage: docker.io/library/redis:7.4
  s3:
    endpoint: ""
    bucket: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

metrics:
  enabled: true
  port: 8080

probes:
  port: 8081

nodeSelector: {}
tolerations: []
affinity: {}
