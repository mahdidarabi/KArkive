{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karkive.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "karkive.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  karkive.json: |-
{{ .Files.Get "dashboards/karkive.json" | nindent 4 }}
{{- end }}
